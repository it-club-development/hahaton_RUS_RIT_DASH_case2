services:
  db:
    image: mariadb:12.3.3-noble
    environment:
      MARIADB_DATABASE: webotchet
      MARIADB_USER: webotchet
      MARIADB_PASSWORD: ${WEBOTCHET_DB_PASSWORD:?Set WEBOTCHET_DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    ports:
      - "127.0.0.1:${WEBOTCHET_DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mariadb-data:

